name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Die Backend-Tests laufen in der CI gegen ein echtes Postgres 17, lokal gegen PGlite.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: headroom
          POSTGRES_PASSWORD: headroom-ci
          POSTGRES_DB: headroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U headroom -d headroom_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://headroom:headroom-ci@127.0.0.1:5432/headroom_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Electron wird für die Prüfung nicht gebraucht und lädt sonst ein großes Binary.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
