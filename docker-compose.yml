# Startet Backend und Postgres: docker compose up --build
# Vorher .env aus .env.example anlegen und secrets/prelogin_secret mit mindestens 32 zufälligen Zeichen füllen.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: headroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: headroom
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U headroom -d headroom']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: &logging
      driver: local
      # Größenbegrenzt; eine Löschung nach 14 Tagen stellt der Hosting-Anbieter ein (siehe README).
      options:
        max-size: 10m
        max-file: '14'

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://headroom:${POSTGRES_PASSWORD}@db:5432/headroom
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS fehlt}
      PRELOGIN_SECRET_FILE: /run/secrets/prelogin_secret
      LOG_LEVEL: info
    secrets:
      - prelogin_secret
    ports:
      - '127.0.0.1:8080:8080'
    logging: *logging

secrets:
  prelogin_secret:
    file: ./secrets/prelogin_secret

volumes:
  db-data:
